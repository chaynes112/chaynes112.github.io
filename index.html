<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuck Haynes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002855;   /* WVU Blue */
    --gold: #EAAA00;   /* WVU Old Gold */
    --deep: #001a38;
    --text: #f4f1e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--deep) radial-gradient(ellipse at top, var(--navy) 0%, var(--deep) 70%) fixed;
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    overflow-x: hidden;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .mountains { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 38vh; z-index: 1; }
  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 2rem 1rem 6.5rem;
  }
  .logo-wrap { width: min(220px, 50vw); margin-bottom: 1.5rem; animation: rise 1.2s ease-out both; }
  .logo-wrap img { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  .logo-fallback {
    font-family: "Oswald", Impact, sans-serif; font-weight: 700;
    font-size: clamp(4rem, 18vw, 8rem); line-height: 1; color: var(--gold);
    letter-spacing: -.04em; text-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  h1 {
    font-family: "Oswald", Impact, sans-serif; font-weight: 700;
    font-size: clamp(2.6rem, 9vw, 5.5rem);
    letter-spacing: .06em; word-spacing: .3em; text-transform: uppercase;
    margin: 0; animation: rise 1.2s .2s ease-out both;
  }
  .rule { width: 120px; height: 4px; background: var(--gold); border-radius: 2px; margin: 1.1rem auto; animation: grow 1s .6s ease-out both; }
  .tag {
    font-family: "Oswald", Impact, sans-serif; font-weight: 500;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    color: var(--gold); letter-spacing: .12em; text-transform: uppercase;
    margin: 0; animation: rise 1.2s .8s ease-out both;
  }
  .sub { margin-top: .75rem; opacity: .8; animation: rise 1.2s 1s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .music {
    position: fixed; z-index: 3; right: 1.25rem; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: .6rem;
    padding: .7rem 1.1rem; border: 2px solid var(--gold); border-radius: 999px;
    background: rgba(0, 26, 56, .85); color: var(--gold);
    font: 500 1rem "Oswald", Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; transition: background .2s, color .2s;
  }
  .music:hover, .music:focus-visible { background: var(--gold); color: var(--deep); outline: none; }
  .music:disabled { opacity: .6; cursor: wait; }
  .music .icon { font-size: 1.2rem; line-height: 1; }
  midi-player { display: none; }
  .games { width: min(960px, 100%); margin-top: 2.25rem; animation: rise 1.2s 1.2s ease-out both; }
  .games h2 {
    font: 500 1rem "Oswald", Impact, sans-serif; letter-spacing: .2em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 .9rem;
  }
  .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
  .game {
    background: rgba(0, 26, 56, .78); border: 1px solid rgba(234, 170, 0, .35); border-top: 3px solid var(--gold);
    border-radius: 10px; padding: 1rem 1.1rem; text-align: left;
  }
  .game .sport { font: 500 .8rem "Oswald", Impact, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  .game .matchup { display: flex; align-items: center; gap: .55rem; margin: .5rem 0 .35rem; font-weight: 600; font-size: 1.1rem; line-height: 1.25; }
  .game .matchup img { width: 30px; height: 30px; object-fit: contain; flex: none; }
  .game .when { opacity: .85; font-size: .92rem; }
  .game .live { color: #ff6b5b; font-weight: 600; }
  .game dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; margin: .75rem 0 0; font-size: .88rem; }
  .game dt { opacity: .65; }
  .game dd { margin: 0; font-weight: 600; }
  .game .note { opacity: .7; font-size: .92rem; margin-top: .5rem; }
  .games .source { margin: .7rem 0 0; font-size: .78rem; opacity: .55; }
  .games .team-logo { display: block; width: 96px; height: auto; margin: 0 auto .6rem; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  /* Cartoon Mountaineer -- in the page flow on narrow screens, standing on the mountains on wide ones */
  .mascot { width: 120px; margin: 2rem auto 0; pointer-events: none; }
  .mascot svg { display: block; width: 100%; height: auto; overflow: visible; }
  @media (min-width: 1200px) {
    .mascot { position: fixed; z-index: 2; left: 2rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); width: 140px; margin: 0; }
  }
  .mascot .bob { animation: bob 1.6s ease-in-out infinite; }
  .mascot .wave { transform-box: view-box; transform-origin: 104px 112px; animation: wave 1.2s ease-in-out infinite; }
  .mascot .tail { transform-box: view-box; transform-origin: 54px 60px; animation: tail 1.6s ease-in-out infinite; }
  .mascot .eyes { transform-box: view-box; transform-origin: 80px 68px; animation: blink 4s infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes wave { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(22deg); } }
  @keyframes tail { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<script>
  // Country Roads MIDI -- browsers block audio until a click, so it starts from the button
  const player = document.getElementById('player');
  const btn = document.getElementById('music');
  const icon = document.getElementById('music-icon');
  const label = document.getElementById('music-label');
  function idle() { icon.innerHTML = '&#9654;'; label.textContent = 'Country Roads'; btn.setAttribute('aria-label', 'Play Take Me Home, Country Roads'); }
  player.addEventListener('load', () => { btn.disabled = false; idle(); });
  player.addEventListener('start', () => { icon.innerHTML = '&#10074;&#10074;'; label.textContent = 'Pause'; btn.setAttribute('aria-label', 'Pause music'); });
  player.addEventListener('stop', idle);
  btn.addEventListener('click', () => player.playing ? player.stop() : player.start());
</script>

<script>
  // Twinkling starfield behind the mountains
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let stars = [];
  function size() {
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 3500) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height * 0.75,
      r: (Math.random() * 1.2 + 0.3) * devicePixelRatio, p: Math.random() * Math.PI * 2,
      gold: Math.random() < 0.15
    }));
  }
  // Shooting star: every 5-10 seconds one streaks down and to the left across the upper sky
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let meteor = null, nextMeteor = 2500;
  function drawMeteor(t) {
    if (!meteor && t >= nextMeteor && !calm) {
      meteor = { x0: c.width * (0.35 + Math.random() * 0.6), y0: c.height * Math.random() * 0.3, start: t, life: 1100 };
    }
    if (!meteor) return;
    const k = (t - meteor.start) / meteor.life;
    if (k >= 1) { meteor = null; nextMeteor = t + 5000 + Math.random() * 5000; return; }
    const dist = k * c.width * 0.35, len = 240 * devicePixelRatio * Math.min(1, k * 4);
    const hx = meteor.x0 - dist * 0.87, hy = meteor.y0 + dist * 0.5;
    const tx = hx + len * 0.87, ty = hy - len * 0.5;
    const g = x.createLinearGradient(hx, hy, tx, ty);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.75)');
    g.addColorStop(0.55, 'rgba(234,170,0,.45)'); g.addColorStop(1, 'rgba(234,170,0,0)');
    x.globalAlpha = k < 0.8 ? 1 : (1 - k) / 0.2;
    x.strokeStyle = g; x.lineWidth = 3 * devicePixelRatio; x.lineCap = 'round';
    x.beginPath(); x.moveTo(hx, hy); x.lineTo(tx, ty); x.stroke();
    x.shadowColor = '#fff'; x.shadowBlur = 12 * devicePixelRatio;
    x.fillStyle = '#fff'; x.beginPath(); x.arc(hx, hy, 2.6 * devicePixelRatio, 0, Math.PI * 2); x.fill();
    x.shadowBlur = 0;
  }
  function draw(t) {
    x.clearRect(0, 0, c.width, c.height);
    for (const s of stars) {
      x.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(t / 1400 + s.p));
      x.fillStyle = s.gold ? '#EAAA00' : '#ffffff';
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI * 2); x.fill();
    }
    drawMeteor(t);
    requestAnimationFrame(draw);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(draw);
</script>

<script>
  // Next games -- pulled live from ESPN's public APIs on every page load.
  // The core API lists every game on a team's season; the site scoreboard adds poll ranks, status and logos.
  const CORE = 'https://sports.core.api.espn.com/v2/sports/';
  const SITE = 'https://site.api.espn.com/apis/site/v2/sports/';
  const ET = 'America/New_York';
  const SEASON = new Date().getMonth() < 6 ? new Date().getFullYear() - 1 : new Date().getFullYear();
  // ESPN names basketball seasons by the year they end (2026-27 = 2027)
  const seasonFor = card => SEASON + (card.dataset.seasonEnd ? 1 : 0);
  const getJSON = url => fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const isWVU = c => /West Virginia/i.test(c.team.displayName || c.team.location || '');
  const rank = c => { const r = c.curatedRank && c.curatedRank.current; return r && r < 99 ? '#' + r : 'Unranked'; };
  const ymdET = iso => new Intl.DateTimeFormat('en-CA', { timeZone: ET, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso)).replace(/-/g, '');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // Every game on a team's season, from the core API
  async function seasonEvents(sport, league, team, season) {
    const list = await getJSON(CORE + sport + '/leagues/' + league + '/seasons/' + season + '/teams/' + team + '/events?limit=100');
    return Promise.all((list.items || []).map(i => getJSON(i.$ref.replace(/^http:/, 'https:')).catch(() => null)));
  }

  // Conference record counted from finished conference games; soccer adds ties (W-L-T)
  function confRecord(events, team, sport) {
    let w = 0, l = 0, t = 0;
    const done = Date.now() - 3 * 3600e3;
    for (const e of events) {
      const c = e && e.competitions && e.competitions[0];
      if (!c || !c.conferenceCompetition || new Date(e.date) > done) continue;
      const me = c.competitors.find(x => x.id === String(team)), them = c.competitors.find(x => x.id !== String(team));
      if (!me || !them) continue;
      if (me.winner) w++; else if (them.winner) l++; else t++;
    }
    return sport === 'soccer' ? w + '-' + l + '-' + t : w + '-' + l;
  }

  // ESPN's football feed carries conference records; soccer has to be counted from the schedule
  async function confFor(card, competitor, events) {
    const conf = (competitor.records || []).find(r => r.type === 'vsconf');
    if (conf) return conf.summary;
    const { sport, league } = card.dataset;
    return confRecord(events || await seasonEvents(sport, league, competitor.id, seasonFor(card)), competitor.id, sport);
  }

  // First game that hasn't finished: walk the season list from a few hours ago forward
  async function nextGame(card) {
    const { sport, league, team, groups } = card.dataset;
    const events = await seasonEvents(sport, league, team, seasonFor(card));
    card._events = events;
    const cutoff = Date.now() - 4 * 3600e3;
    const upcoming = events.filter(e => e && new Date(e.date) >= cutoff).sort((a, b) => new Date(a.date) - new Date(b.date));
    for (const ev of upcoming) {
      const sb = await getJSON(SITE + sport + '/' + league + '/scoreboard?limit=500&dates=' + ymdET(ev.date) + (groups ? '&groups=' + groups : ''));
      const match = (sb.events || []).find(e => e.id === ev.id);
      if (!match) continue;
      if (match.competitions[0].status.type.state !== 'post') return match;
    }
    return null;
  }

  // Soccer teams just outside the United Soccer Coaches top 25. ESPN's copy of the poll says who is receiving
  // votes but not how many; the counts below are copied from unitedsoccercoaches.org and only show while
  // ESPN's latest poll is the one they came from. Update these when a new poll comes out (Tuesdays).
  const SOCCER_VOTES = {
    'usa.ncaa.w.1': { poll: '2026-10-27', teams: { '20382': 3 } },
  };
  async function soccerVotes(card) {
    const { sport, league } = card.dataset;
    if (sport !== 'soccer') return {};
    const list = await getJSON(CORE + sport + '/leagues/' + league + '/rankings');
    const poll = await getJSON(list.items[0].$ref.replace(/^http:/, 'https:'));
    const known = SOCCER_VOTES[league];
    const current = known && (poll.date || '').startsWith(known.poll);
    const out = {};
    for (const o of poll.others || []) {
      const id = ((o.team && o.team.$ref) || '').match(/\/teams\/(\d+)/);
      if (!id) continue;
      const n = current && known.teams[id[1]];
      out[id[1]] = n ? 'received ' + n + ' vote' + (n === 1 ? '' : 's') : 'receiving votes';
    }
    return out;
  }

  async function loadGame(card) {
    const label = card.querySelector('.sport').textContent;
    try {
      const ev = await nextGame(card);
      card.replaceChildren(el('div', 'sport', label));
      if (!ev) { card.append(el('p', 'note', 'No upcoming game scheduled')); return; }

      card.dataset.when = new Date(ev.date).getTime();
      const comp = ev.competitions[0];
      const wv = comp.competitors.find(isWVU) || comp.competitors[0];
      const opp = comp.competitors.find(c => c !== wv);
      const prefix = comp.neutralSite || wv.homeAway === 'home' ? 'vs' : 'at';

      const matchup = el('div', 'matchup');
      const logo = opp.team.logo || (opp.team.logos && opp.team.logos[0] && opp.team.logos[0].href);
      if (logo) { const img = el('img'); img.src = logo; img.alt = ''; matchup.append(img); }
      matchup.append(el('span', null, prefix + ' ' + (opp.team.location || opp.team.shortDisplayName || opp.team.displayName)));

      const d = new Date(ev.date);
      const state = comp.status && comp.status.type && comp.status.type.state;
      let when;
      if (state === 'in') {
        when = el('div', 'when'); when.append(el('span', 'live', 'LIVE NOW'), ' · ' + comp.status.type.shortDetail);
      } else {
        const day = d.toLocaleDateString('en-US', { timeZone: ET, weekday: 'short', month: 'short', day: 'numeric' });
        const time = comp.timeValid === false ? 'Time TBA' : d.toLocaleTimeString('en-US', { timeZone: ET, hour: 'numeric', minute: '2-digit' }) + ' ET';
        when = el('div', 'when', day + ' · ' + time);
      }

      // Record shown as overall (conference), e.g. 9-4-2 (5-1-2)
      // ESPN writes soccer records as W-T-L; flip to W-L-T to match the conference counts
      const overall = c => {
        const r = (c.records || []).find(x => x.type === 'total');
        if (!r) return '—';
        const p = r.summary.split('-');
        return card.dataset.sport === 'soccer' && p.length === 3 ? [p[0], p[2], p[1]].join('-') : r.summary;
      };
      const [oppConf, wvConf, votes] = await Promise.all([confFor(card, opp).catch(() => null), confFor(card, wv, card._events).catch(() => null), soccerVotes(card).catch(() => ({}))]);
      const record = (c, conf) => overall(c) + (conf ? ' (' + conf + ')' : '');
      const rankText = c => rank(c) + (rank(c) === 'Unranked' && votes[c.id] ? ' (' + votes[c.id] + ')' : '');
      const dl = el('dl');
      dl.append(el('dt', null, 'Opponent rank'), el('dd', null, rankText(opp)), el('dt', null, 'Opponent record'), el('dd', null, record(opp, oppConf)),
                el('dt', null, 'WVU rank'), el('dd', null, rankText(wv)), el('dt', null, 'WVU record'), el('dd', null, record(wv, wvConf)));
      card.append(matchup, when, dl);
    } catch (e) {
      card.replaceChildren(el('div', 'sport', label), el('p', 'note', 'Schedule unavailable right now'));
    }
  }
  // Hand-entered cards, for teams with no live feed. Each sport shows its first game that hasn't
  // finished yet. Times are UTC: EDT = ET+4 until Nov 1, EST = ET+5 after (7:00 PM EST = 00:00Z next day).
  function manualCard({ label, games = [], done, rows }) {
    const card = el('article', 'game');
    card.append(el('div', 'sport', label));
    const g = games.find(x => new Date(x.date) >= Date.now() - 4 * 3600e3);
    if (!g) {
      card.append(el('p', 'note', done || 'No upcoming game scheduled'));
      if (rows) { const dl = el('dl'); rows.forEach(([k, v]) => dl.append(el('dt', null, k), el('dd', null, v))); card.append(dl); }
      return card;
    }
    const d = new Date(g.date);
    card.dataset.when = d.getTime();
    const matchup = el('div', 'matchup');
    if (g.logo) { const img = el('img'); img.src = g.logo; img.alt = ''; matchup.append(img); }
    matchup.append(el('span', null, g.title));
    const day = d.toLocaleDateString('en-US', { timeZone: ET, weekday: 'short', month: 'short', day: 'numeric' });
    const time = g.timeTBA ? 'Time TBA' : d.toLocaleTimeString('en-US', { timeZone: ET, hour: 'numeric', minute: '2-digit' }) + ' ET';
    const dl = el('dl');
    g.rows.forEach(([k, v]) => dl.append(el('dt', null, k), el('dd', null, v)));
    card.append(matchup, el('div', 'when', day + ' · ' + time + (g.where ? ' · ' + g.where : '')), dl);
    return card;
  }
  const byDate = grid => { const at = c => Number(c.dataset.when) || Infinity; [...grid.children].sort((a, b) => at(a) - at(b)).forEach(c => grid.append(c)); };

  // WVU sports ESPN doesn't carry (rifle) or hasn't loaded yet (baseball 2027) -- from wvusports.com.
  // Rifle rank: CRCA Top 20 through Oct 25, 2026 (ssusa.org). Update after each new poll.
  const WVU_MANUAL = [
    { label: 'Rifle', games: [
      { date: '2026-11-14T16:00:00Z', title: 'WVU Fall Classic', where: 'Morgantown', rows: [
        ['Opponents', '#4 TCU, #5 Nebraska, #6 Ole Miss, #7 Kentucky'], ['WVU rank', '#1'], ['WVU record', '7-1 (2-1)']] },
    ] },
    { label: 'Baseball', games: [
      { date: '2027-02-19T17:00:00Z', timeTBA: true, title: 'at College of Charleston', rows: [
        ['Opponent rank', 'No poll yet'], ['Opponent record', '0-0'], ['WVU rank', 'No poll yet'], ['WVU record', '0-0 (0-0)']] },
    ] },
  ];
  // Soonest game first; cards with no game go last
  const grid = document.getElementById('game-grid');
  const espnCards = [...grid.children];
  WVU_MANUAL.forEach(s => grid.append(manualCard(s)));
  Promise.all(espnCards.map(loadGame)).then(() => byDate(grid));

  // Sissonville High School -- no public live feed, so schedules (MaxPreps) and ranks are entered by hand.
  // Football ranks are the WVSSAC playoff ratings (Tuesdays); soccer shows WVSSAC state-tournament seeds.
  const SVILLE_SOURCE = 'Football ranks: WVSSAC playoff ratings, Week 9 (Oct 27, 2026). Soccer: WVSSAC state tournament seeds. Records as of Oct 31, 2026.';
  const SVILLE = [
    { label: 'Football', games: [
      { date: '2026-11-07T00:00:00Z', title: 'at Wayne', logo: 'wayne-logo.png', rows: [
        ['Opponent rank', '#31 in Class AA'], ['Opponent record', '0-9'], ['Sissonville rank', '#3 in Class AA'], ['Sissonville record', '9-0']] },
    ] },
    { label: 'Girls Soccer', games: [
      { date: '2026-11-05T17:00:00Z', title: 'vs Lincoln', logo: 'lincoln-logo.png', where: 'State semifinal, Beckley', rows: [
        ['Opponent seed', 'No. 2 in Class AA/A'], ['Opponent record', '17-3'], ['Sissonville seed', 'No. 3 in Class AA/A'], ['Sissonville record', '16-4']] },
    ] },
    { label: 'Boys Soccer', done: 'Season complete', rows: [['Sissonville record', '13-8']] },
  ];
  (function () {
    const grid = document.getElementById('sville-grid');
    SVILLE.forEach(s => grid.append(manualCard(s)));
    byDate(grid);
    document.getElementById('sville-source').textContent = SVILLE_SOURCE;
  })();
</script>
