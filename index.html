<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let's Go Mountaineers!</title>
<link rel="icon" type="image/png" href="wvu-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #002855;   /* WVU Blue */
    --gold: #EAAA00;   /* WVU Old Gold */
    --deep: #001a38;
    --text: #f4f1e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--deep) radial-gradient(ellipse at top, var(--navy) 0%, var(--deep) 70%) fixed;
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    overflow-x: hidden;
  }
  #stars { position: fixed; inset: 0; z-index: 0; }
  .mountains { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 38vh; z-index: 1; }
  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 2rem 1rem 6.5rem;
  }
  .logo-wrap { position: relative; width: min(220px, 50vw); margin-bottom: 1.5rem; animation: rise 1.2s ease-out both; }
  /* Easter egg: the (R) on the Flying WV sets off fireworks -- invisible button centered on it (73.3% across, 95.8% down) */
  #r-spot { position: absolute; left: 73.3%; top: 95.8%; width: 22px; height: 22px; transform: translate(-50%, -50%);
                 padding: 0; border: 0; background: transparent; cursor: default; -webkit-tap-highlight-color: transparent; }
  #r-spot:focus { outline: none; }
  @media (pointer: coarse) { #r-spot { width: 44px; height: 44px; } }
  /* The pop-up guy peeks in from the bottom-right corner, like the old arcade gag */
  #toasty { position: fixed; z-index: 5; right: 0; bottom: 0; width: min(260px, 55vw); pointer-events: none; }
  #toasty img { display: block; width: 100%; height: auto; }
  .logo-wrap img { width: 100%; height: auto; display: block; filter: drop-shadow(0 6px 18px rgba(0,0,0,.5)); }
  .logo-fallback {
    font-family: "Oswald", Impact, sans-serif; font-weight: 700;
    font-size: clamp(4rem, 18vw, 8rem); line-height: 1; color: var(--gold);
    letter-spacing: -.04em; text-shadow: 0 6px 18px rgba(0,0,0,.5);
  }
  .tag {
    font-family: "Oswald", Impact, sans-serif; font-weight: 500;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    color: var(--gold); letter-spacing: .12em; text-transform: uppercase;
    margin: 0; animation: rise 1.2s .3s ease-out both;
  }
  .subhead {
    font: 500 .95rem "Oswald", Impact, sans-serif; letter-spacing: .18em; text-transform: uppercase;
    color: var(--text); opacity: .8; margin: .45rem 0 0; animation: rise 1.2s .5s ease-out both;
  }
  .games .subhead { margin: -.5rem 0 2.25rem; animation: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .music {
    position: fixed; z-index: 3; right: 1.25rem; bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: .6rem;
    padding: .7rem 1.1rem; border: 2px solid var(--gold); border-radius: 999px;
    background: rgba(0, 26, 56, .85); color: var(--gold);
    font: 500 1rem "Oswald", Impact, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    cursor: pointer; transition: background .2s, color .2s;
  }
  .music:hover, .music:focus-visible { background: var(--gold); color: var(--deep); outline: none; }
  .music:disabled { opacity: .6; cursor: wait; }
  .music .icon { font-size: 1.2rem; line-height: 1; }
  midi-player { display: none; }
  .games { width: min(1280px, 100%); margin-top: 2.25rem; animation: rise 1.2s 1.2s ease-out both; }
  .games h2 {
    font: 500 1rem "Oswald", Impact, sans-serif; letter-spacing: .2em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 .9rem;
  }
  .game-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); gap: 1rem; }
  /* WVU | opponent comparison table under each matchup */
  .game .cmp { display: grid; grid-template-columns: auto 1fr 1fr; gap: .2rem .8rem; margin: .75rem 0 0; font-size: .88rem; white-space: nowrap; }
  .game .cmp-head { font: 500 .78rem "Oswald", Impact, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
  .game .cmp-label { opacity: .65; }
  .game .cmp-val { font-weight: 600; }
  .game .cmp-val a, .game dd a { color: inherit; }
  .game .cmp-wide { grid-column: span 2; }
  .game .cmp-lines { white-space: pre; }   /* one entry per line (rifle opponents) */
  .game .details dl { margin-top: .5rem; }
  .game dd { white-space: nowrap; }
  /* phones are too narrow for one-line values; let long ones wrap rather than run off the card */
  @media (max-width: 480px) { .game dd, .game .cmp, .game .team-name { white-space: normal; }
    .game .team-name { height: auto; min-height: 32px; } .game .team, .game .team-main, .game .team-name span { min-width: 0; } .game .team { flex: 1 1 0; } }
  .game {
    background: rgba(0, 26, 56, .78); border: 2px solid rgba(234, 170, 0, .35); border-top: 3px solid var(--gold);
    border-radius: 10px; padding: 1rem 1.1rem; text-align: left;
  }
  .game .sport { font: 500 .8rem "Oswald", Impact, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  .game .matchup { display: flex; align-items: center; gap: .55rem; margin: .5rem 0 .35rem; font-weight: 600; font-size: 1.1rem; line-height: 1.25; }
  /* Matchup: [logo][rank] West Virginia / record  vs  [logo][rank] Opponent / record -- the biggest text on the card */
  .game .teams { display: flex; align-items: flex-start; gap: .5rem; margin: .9rem 0 .75rem; }
  .game .team { display: flex; align-items: flex-start; gap: .4rem; }
  .game .team-lead { display: flex; align-items: center; gap: .4rem; height: 32px; flex: none; }
  .game .team-name { display: flex; align-items: center; height: 32px; font-weight: 600; font-size: 1.2rem; line-height: 1.25; white-space: nowrap; }
  .game .team-lead img { width: 30px; height: 30px; object-fit: contain; flex: none;
                         /* thin light outline so dark logos (Cincinnati, Texas Tech, Colorado) show on navy */
                         filter: drop-shadow(0 0 .6px rgba(255,255,255,.95)) drop-shadow(0 0 .6px rgba(255,255,255,.95)); }
  .game .team-rank { color: var(--gold); font-size: 1.05rem; font-weight: 700; }
  .game .team-rec { font-size: 1rem; opacity: .75; margin-top: .1rem; }
  .game .team-vs { opacity: .7; font-size: 1.1rem; padding-top: .25rem; }
  .game .matchup img { width: 30px; height: 30px; object-fit: contain; flex: none; }
  .game .when { opacity: .85; font-size: 1.05rem; }
  /* phones: the bigger names don't fit side by side, so each team gets its own line */
  @media (max-width: 480px) {
    .game .teams { flex-direction: column; gap: .1rem; }
    .game .teams .team-name { white-space: normal; height: auto; min-height: 32px; }
    .game .team-vs { padding: 0; font-size: .95rem; }
  }
  .game .when.with-spread { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
  .game .when .spread { font-weight: 600; white-space: nowrap; }
  /* LIVE NOW: red, slowly fading down and back up (2.4s per pulse); steady for people who turn off animations */
  .game .live { color: #ff3b2f; font-weight: 600; animation: live-pulse 2.4s ease-in-out infinite; }
  @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .game .live { animation: none; } }
  .game .final { color: var(--gold); font-weight: 700; }
  /* a card with a game in progress: the gold border turns the same red as LIVE NOW */
  .game:has(.live) { border-color: rgba(255, 59, 47, .35); border-top-color: #ff3b2f; }
  /* a finished game (FINAL), until the card moves on to the next game: light blue border */
  .game:has(.final) { border-color: rgba(91, 192, 235, .35); border-top-color: #5bc0eb; }
  /* live / final score, right after each team's name */
  .game .team-score { font: 700 1.6rem/32px "Oswald", Impact, sans-serif; margin-left: .35rem; flex: none; }
  .game .team-score.lost { opacity: .55; }
  .game dl { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; margin: .75rem 0 0; font-size: .88rem; }
  .game dt { opacity: .65; }
  .game dd { margin: 0; font-weight: 600; }
  .game .note { opacity: .7; font-size: .92rem; margin-top: .5rem; }
  /* the *received-votes note sits at the very bottom of its card */
  .game { display: flex; flex-direction: column; }
  .game .footnote { margin: auto 0 0; padding-top: .6rem; font-size: .78rem; opacity: .7; }
  /* logo + text cards (Season Ended, Playoffs Schedule TBA): same gap under the sport label and same text as the date line on game cards */
  .game .note.with-logo { display: flex; align-items: center; gap: .55rem; margin-top: .9rem; opacity: 1; font-size: 1.05rem; color: rgba(244, 241, 232, .85); }
  .game .note.with-logo img { width: 42px; height: 30px; object-fit: contain; flex: none;
                              /* same thin light outline as the matchup logos */
                              filter: drop-shadow(0 0 .6px rgba(255,255,255,.95)) drop-shadow(0 0 .6px rgba(255,255,255,.95)); }
  .games .source { margin: .7rem 0 0; font-size: .78rem; opacity: .55; }
  .games.sville { margin-top: 4rem; }
  .games .team-logo-wrap { position: relative; width: 96px; margin: 0 auto .6rem; }
  /* Easter egg: the arrowhead on the Sissonville logo plays Indian Outlaw -- invisible button over it (88.7% across, 27.7% down) */
  #outlaw-spot { position: absolute; left: 88.7%; top: 27.7%; width: 22%; height: 30%; transform: translate(-50%, -50%);
                 padding: 0; border: 0; background: transparent; cursor: default; -webkit-tap-highlight-color: transparent; }
  #outlaw-spot:focus { outline: none; }
  @media (pointer: coarse) { #outlaw-spot { width: 32px; height: 32px; } }
  .games .team-logo { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.45)); }
  /* Cartoon Mountaineer and Sissonville Indian side by side -- in the page flow on narrow screens, standing on the mountains on wide ones */
  .mascot { display: flex; gap: 10px; width: 250px; margin: 2rem auto 0; pointer-events: none; }
  .mascot svg { display: block; flex: 1 1 0; min-width: 0; height: auto; overflow: visible; }
  /* wide screens: centered in the empty strip between the left edge of the screen and the 1280px game cards,
     shrinking to fit when that strip is narrower than 290px */
  @media (min-width: 1640px) {
    .mascot { position: fixed; z-index: 2; bottom: calc(1rem + env(safe-area-inset-bottom, 0px)); margin: 0;
              width: min(290px, calc((100% - 1280px) / 2 - 16px));
              left: calc(((100% - 1280px) / 2 - min(290px, calc((100% - 1280px) / 2 - 16px))) / 2); }
    /* Country Roads button centered in the strip between the cards and the right edge */
    .music { right: calc((100% - 1280px) / 4); transform: translateX(50%); }
  }
  .mascot .bob { animation: bob 1.6s ease-in-out infinite; }
  .mascot .ready { transform-box: view-box; transform-origin: 77px 150px; animation: ready 2.4s ease-in-out infinite; }
  /* Click the Mountaineer to fire the rifle (hidden: the cursor stays an arrow) */
  .mascot svg .bob { pointer-events: visiblePainted; cursor: default; }
  .mascot .recoil { transform-box: view-box; transform-origin: 77px 150px; }
  .mascot .smoke circle { transform-box: fill-box; transform-origin: center; }
  .mascot .tail { transform-box: view-box; transform-origin: 54px 53px; animation: tail 1.6s ease-in-out infinite; }
  .mascot .eyes { transform-box: view-box; transform-origin: 80px 68px; animation: blink 4s infinite; }
  .mascot svg.indian .eyes { animation-delay: -2s; } /* blinks halfway between the Mountaineer's blinks */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes ready { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  @keyframes tail { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  /* Easter egg: one star (top right) launches a UFO. The hotspot is invisible and keeps the normal cursor. */
  #egg { position: fixed; z-index: 3; left: calc(90vw - 16px); top: calc(12vh - 16px); width: 32px; height: 32px;
         padding: 0; border: 0; background: transparent; cursor: default; -webkit-tap-highlight-color: transparent; }
  #egg:focus { outline: none; }
  /* Bigger hidden target for fingers on touch screens (still centered on the star) */
  @media (pointer: coarse) { #egg { left: calc(90vw - 26px); top: calc(12vh - 26px); width: 52px; height: 52px; } }
  #ufo { position: fixed; z-index: 1; left: 0; top: 0; width: 130px; pointer-events: none; will-change: transform;
         filter: drop-shadow(0 0 12px rgba(120, 255, 200, .55)); }
  #ufo svg { display: block; width: 100%; height: auto; }
  #ufo .light { animation: ufo-blink .6s steps(2, jump-none) infinite; }
  #ufo .light:nth-of-type(2n) { animation-delay: .3s; }
  @keyframes ufo-blink { from { opacity: 1; } to { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<button id="egg" type="button" tabindex="-1" aria-hidden="true"></button>
<div id="toasty" hidden aria-hidden="true"><img alt="" src="toasty.gif?v=3"></div>
<div id="ufo" hidden aria-hidden="true">

    <path d="M45 30 Q45 8 65 8 Q85 8 85 30 Z" fill="#a9ecff" opacity=".85"/>

    <circle class="light" cx="65" cy="42" r="3.5" fill="#EAAA00"/>

</div>

<svg class="mountains" viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true">
  <path fill="#00213f" d="M0 260 L120 170 L230 230 L380 120 L520 220 L640 150 L780 240 L920 110 L1060 210 L1200 140 L1340 220 L1440 170 L1440 400 L0 400 Z"/>
  <path fill="#001630" d="M0 320 L160 240 L300 300 L450 210 L600 290 L760 220 L900 300 L1060 230 L1220 300 L1440 240 L1440 400 L0 400 Z"/>
  <path fill="#000e22" d="M0 370 L200 320 L420 360 L640 310 L860 365 L1080 320 L1300 360 L1440 330 L1440 400 L0 400 Z"/>
</svg>

<main>

    <img src="wvu-logo.png" alt="WVU logo" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-fallback',textContent:'WV'}))">
    <button id="r-spot" type="button" tabindex="-1" aria-hidden="true"></button>
  </div>
  <p class="tag">West Virginia Mountaineers</p>
  <p class="subhead">Upcoming Games</p>

  <section class="games" aria-label="Next Mountaineer games">
    <div class="game-grid" id="game-grid">
      <article class="game" data-sport="football" data-league="college-football" data-team="277" data-conf="Big 12" data-groups="80" data-polls="Playoff Committee Rankings|AP Top 25"><div class="sport">Football</div><p class="note">Loading&hellip;</p></article>
      <article class="game" data-sport="soccer" data-league="usa.ncaa.m.1" data-team="5658" data-conf="Sun Belt"><div class="sport">Men's Soccer</div><p class="note">Loading&hellip;</p></article>
      <article class="game" data-sport="soccer" data-league="usa.ncaa.w.1" data-team="20382" data-conf="Big 12" data-votes="1" data-fallback="Women's Soccer"><div class="sport">Women's Soccer</div><p class="note">Loading&hellip;</p></article>
      <article class="game" data-sport="basketball" data-league="mens-college-basketball" data-team="277" data-conf="Big 12" data-groups="50" data-season-end="1" data-votes="Coaches Poll"><div class="sport">Men's Basketball</div><p class="note">Loading&hellip;</p></article>
      <article class="game" data-sport="basketball" data-league="womens-college-basketball" data-team="277" data-conf="Big 12" data-groups="50" data-season-end="1"><div class="sport">Women's Basketball</div><p class="note">Loading&hellip;</p></article>
      <article class="game" data-sport="volleyball" data-league="womens-college-volleyball" data-team="277" data-conf="Big 12"><div class="sport">Volleyball</div><p class="note">Loading&hellip;</p></article>
      <article class="game" data-sport="baseball" data-league="college-baseball" data-team="136" data-season-end="1" data-conf="Big 12" data-scan="7" data-fallback="Baseball"><div class="sport">Baseball</div><p class="note">Loading&hellip;</p></article>

  <section class="games sville" aria-labelledby="sville-title">

    </div>

    <p class="subhead">Upcoming Games</p>
    <div class="game-grid" id="sville-grid"></div>
  </section>

  <div class="mascot" aria-hidden="true">

      <ellipse cx="80" cy="212" rx="52" ry="6" fill="#000" opacity=".35"/>

        <!-- fringed buckskin leggings and moccasins, wide stance -->

        <!-- buckskin hunting shirt with shading -->
        <path d="M46 106 Q80 95 114 106 L119 160 Q80 170 41 160 Z" fill="#9c6532" stroke="#141414" stroke-width="2.2"/>

        <!-- hem fringe -->
        <path d="M44 160 l-2 9 M50 162 l-1 9 M56 163 l-1 9 M62 164 l0 9 M68 165 l0 9 M74 165 l0 9 M86 165 l0 9 M92 165 l0 9 M98 164 l1 9 M104 163 l1 9 M110 162 l1 9 M116 160 l2 9" stroke="#141414" stroke-width="3.4"/>
        <path d="M44 160 l-2 9 M50 162 l-1 9 M56 163 l-1 9 M62 164 l0 9 M68 165 l0 9 M74 165 l0 9 M86 165 l0 9 M92 165 l0 9 M98 164 l1 9 M104 163 l1 9 M110 162 l1 9 M116 160 l2 9" stroke="#b98048" stroke-width="1.8"/>
        <!-- fringed cape across the shoulders -->
        <path d="M45 106 Q80 94 115 106 L112 121 Q80 131 48 121 Z" fill="#b27a42" stroke="#141414" stroke-width="2"/>
        <path d="M50 122 l-1 7 M56 124 l-1 7 M62 126 l0 7 M68 127 l0 7 M92 127 l0 7 M98 126 l0 7 M104 124 l1 7 M110 122 l1 7" stroke="#141414" stroke-width="3.2"/>
        <path d="M50 122 l-1 7 M56 124 l-1 7 M62 126 l0 7 M68 127 l0 7 M92 127 l0 7 M98 126 l0 7 M104 124 l1 7 M110 122 l1 7" stroke="#d29a5c" stroke-width="1.6"/>
        <!-- belt, under the straps -->

<button class="music" id="music" type="button" disabled aria-label="Play Take Me Home, Country Roads">
  <span class="icon" id="music-icon">&#9654;</span><span id="music-label">Loading&hellip;</span>
</button>
<!-- ?v= changes whenever the .mid file is replaced, so browsers don't keep playing a cached old copy -->
<midi-player id="player" src="country-roads.mid?v=2" sound-font loop></midi-player>
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/html-midi-player@1.5.0"></script>
<script>
  // Country Roads MIDI -- browsers block audio until a click, so it starts from the button
  const player = document.getElementById('player');
  const btn = document.getElementById('music');
  const icon = document.getElementById('music-icon');
  const label = document.getElementById('music-label');
  function idle() { icon.innerHTML = '&#9654;'; label.textContent = 'Country Roads'; btn.setAttribute('aria-label', 'Play Take Me Home, Country Roads'); }
  player.addEventListener('load', () => { btn.disabled = false; idle(); });
  player.addEventListener('start', () => { icon.innerHTML = '&#10074;&#10074;'; label.textContent = 'Pause'; btn.setAttribute('aria-label', 'Pause music'); });
  player.addEventListener('stop', idle);
  btn.addEventListener('click', () => {
    if (player.playing) { player.stop(); return; }
    quiet(player);
    player.start();
  });

  // Click the Sissonville logo: the Tomahawk Chop MP3. Click again to pause, again to resume.
  // Loaded with the page so it starts right away; skips the recording's 1.74 s of faint hiss at the top.
  // Country Roads stops so the two don't clash, and the Country Roads button pauses this one.
  const CHOP_START = 1.74;
  const chop = new Audio('tomahawk-chop.mp3');
  chop.preload = 'auto';
  chop.volume = 0.5;   // a little under full so it sits closer to the Country Roads MIDI
  document.querySelector('.sville .team-logo').addEventListener('click', () => {
    if (!chop.paused) { chop.pause(); return; }
    quiet(chop);
    if (chop.ended || chop.currentTime < CHOP_START) chop.currentTime = CHOP_START;
    chop.play();
  });

  // Click the big Flying WV: Country Roads (the recording). Click the arrowhead on the Sissonville logo: Indian Outlaw.
  // Like the Tomahawk Chop: click again to pause, again to resume. Only the start of each file loads with the page.
  // Both files are trimmed so the music starts right at the top (no silence before it).
  const roads = new Audio('country-roads.mp3');
  const outlaw = new Audio('indian-outlaw.mp3');
  for (const a of [roads, outlaw]) { a.preload = 'metadata'; a.volume = 0.5; }   // same level as the Tomahawk Chop
  function toggle(a) {
    if (!a.paused) { a.pause(); return; }
    quiet(a);
    a.play().catch(() => {});
  }
  document.querySelector('.logo-wrap img').addEventListener('click', () => toggle(roads));
  document.getElementById('outlaw-spot').addEventListener('click', () => toggle(outlaw));

  // One song at a time: stop everything except the one being started
  function quiet(keep) {
    if (keep !== player && player.playing) player.stop();
    for (const a of [chop, roads, outlaw]) if (a !== keep && !a.paused) a.pause();
  }
</script>

<script>
  // Twinkling starfield behind the mountains
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let stars = [];
  function size() {
    c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 3500) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height * 0.75,
      r: (Math.random() * 1.2 + 0.3) * devicePixelRatio, p: Math.random() * Math.PI * 2,
      gold: Math.random() < 0.15
    }));
  }
  // Shooting star: every 30-60 seconds one streaks down and to the left across the upper sky
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let meteor = null, nextMeteor = 5000;
  function drawMeteor(t) {
    if (!meteor && t >= nextMeteor && !calm) {
      meteor = { x0: c.width * (0.35 + Math.random() * 0.6), y0: c.height * Math.random() * 0.3, start: t, life: 1100 };
    }
    if (!meteor) return;
    const k = (t - meteor.start) / meteor.life;
    if (k >= 1) { meteor = null; nextMeteor = t + 30000 + Math.random() * 30000; return; }
    const dist = k * c.width * 0.35, len = 240 * devicePixelRatio * Math.min(1, k * 4);
    const hx = meteor.x0 - dist * 0.87, hy = meteor.y0 + dist * 0.5;
    const tx = hx + len * 0.87, ty = hy - len * 0.5;
    const g = x.createLinearGradient(hx, hy, tx, ty);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,.75)');
    g.addColorStop(0.55, 'rgba(234,170,0,.45)'); g.addColorStop(1, 'rgba(234,170,0,0)');
    x.globalAlpha = k < 0.8 ? 1 : (1 - k) / 0.2;
    x.strokeStyle = g; x.lineWidth = 3 * devicePixelRatio; x.lineCap = 'round';
    x.beginPath(); x.moveTo(hx, hy); x.lineTo(tx, ty); x.stroke();
    x.shadowColor = '#fff'; x.shadowBlur = 12 * devicePixelRatio;
    x.fillStyle = '#fff'; x.beginPath(); x.arc(hx, hy, 2.6 * devicePixelRatio, 0, Math.PI * 2); x.fill();
    x.shadowBlur = 0;
  }
  function draw(t) {
    x.clearRect(0, 0, c.width, c.height);
    for (const s of stars) {
      x.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(t / 1400 + s.p));
      x.fillStyle = s.gold ? '#EAAA00' : '#ffffff';
      x.beginPath(); x.arc(s.x, s.y, s.r, 0, Math.PI * 2); x.fill();
    }
    drawMeteor(t);
    // The easter-egg star: same look as the rest, always at 90% across and 12% down, under the #egg hotspot
    x.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(t / 1400 + 1.3));
    x.fillStyle = '#ffffff';
    x.beginPath(); x.arc(innerWidth * 0.9 * devicePixelRatio, innerHeight * 0.12 * devicePixelRatio, 1.6 * devicePixelRatio, 0, Math.PI * 2); x.fill();
    requestAnimationFrame(draw);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(draw);

  // Easter egg: the UFO pops out of the star, swoops left across the sky and leaves the screen
  const ufo = document.getElementById('ufo');
  const UFO_MS = 5200;
  let flying = false, audio = null;

  // Classic sci-fi warble, synthesized (no sound file): a rising then falling tone with fast vibrato,
  // panned right to left so it follows the saucer across the screen
  function ufoSound() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime, dur = UFO_MS / 1000;
    const out = audio.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.16, t + 0.5);
    out.gain.setValueAtTime(0.16, t + dur - 1.2);
    out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const pan = audio.createStereoPanner ? audio.createStereoPanner() : null;
    if (pan) { pan.pan.setValueAtTime(0.8, t); pan.pan.linearRampToValueAtTime(-0.9, t + dur); out.connect(pan).connect(audio.destination); }
    else out.connect(audio.destination);
    const lfo = audio.createOscillator(), depth = audio.createGain();
    lfo.frequency.value = 7; depth.gain.value = 55;
    lfo.connect(depth);
    const tones = [['sine', 1], ['triangle', 1.5]].map(([type, mult]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type;
      o.frequency.setValueAtTime(260 * mult, t);
      o.frequency.exponentialRampToValueAtTime(880 * mult, t + 0.7);
      o.frequency.exponentialRampToValueAtTime(480 * mult, t + dur);
      depth.connect(o.frequency);
      g.gain.value = mult === 1 ? 1 : 0.35;
      o.connect(g).connect(out);
      return o;
    });
    [lfo, ...tones].forEach(o => { o.start(t); o.stop(t + dur + 0.05); });
  }

  document.getElementById('egg').addEventListener('click', () => {
    if (flying) return;
    flying = true;
    ufo.hidden = false;
    ufoSound();
    const w = innerWidth, sx = w * 0.9 - 65, sy = innerHeight * 0.12 - 32, y = innerHeight * 0.2;
    const at = (px, py, s, r) => ({ transform: `translate(${px}px, ${py}px) scale(${s}) rotate(${r}deg)` });
    ufo.animate([
      at(sx, sy, 0.05, 0),
      at(sx - w * 0.05, sy + 10, 0.6, -10),
      at(w * 0.62, y - 30, 1, 8),
      at(w * 0.4, y + 25, 1, -6),
      at(w * 0.18, y - 20, 1, 8),
      at(-220, y - 70, 1, -14),
    ], { duration: UFO_MS, easing: 'ease-in-out' }).onfinish = () => { ufo.hidden = true; flying = false; };
  });

  // Easter egg: fire the Mountaineer's musket three times and the Toasty guy pops in from the corner, like Mortal Kombat.
  // toasty.gif is just his talking loop; the page slides him in and out so he stays up for the whole
  // sound. toasty.mp3 has 0.28 s of silence before the voice; playback skips 0.24 s of it and starts
  // 0.15 s after he does, so he's all the way out before he says "Toasty!".
  const TOASTY_SKIP = 0.24;
  const toasty = document.getElementById('toasty');
  const toastySound = new Audio('toasty.mp3');
  toastySound.preload = 'auto';
  let toasting = false;
  function toastyPop() {
    if (toasting) return;
    toasting = true;
    toasty.hidden = false;
    toastySound.currentTime = TOASTY_SKIP;
    setTimeout(() => toastySound.play().catch(() => {}), 150);
    // in by 0.1 s, up until the clip ends (~0.95 s after the skip), out by 1.2 s
    toasty.animate([
      { transform: 'translate(105%, 40%)' },
      { transform: 'translate(0, 0)', offset: 0.08 },
      { transform: 'translate(0, 0)', offset: 0.79 },
      { transform: 'translate(105%, 40%)' },
    ], { duration: 1200, easing: 'ease-out' }).onfinish = () => { toasty.hidden = true; toasting = false; };
  }

  // Easter egg: click the (R) on the Flying WV for fireworks (one show at a time)
  let fwShow = false;
  document.getElementById('r-spot').addEventListener('click', () => {
    if (fwShow) return;
    fwShow = true;
    fireworks(10000, () => { fwShow = false; });
  });

  // Click the Mountaineer: flintlock fires -- pan flash, muzzle flash, recoil, boom, then a drifting cloud of smoke
  const mascot = document.querySelector('.mascot svg');
  let reloading = false, shots = 0;

  function gunshotSound() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    // heavy black powder: a darker crack with a long rolling tail
    const len = Math.floor(audio.sampleRate * 1.7), buf = audio.createBuffer(1, len, audio.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const noise = audio.createBufferSource(); noise.buffer = buf;
    const tone = audio.createBiquadFilter(); tone.type = 'lowpass';
    tone.frequency.setValueAtTime(3500, t); tone.frequency.exponentialRampToValueAtTime(150, t + 1.12);
    const crack = audio.createGain();
    crack.gain.setValueAtTime(0.0001, t); crack.gain.exponentialRampToValueAtTime(0.55, t + 0.004);
    crack.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    noise.connect(tone).connect(crack).connect(audio.destination);
    // the boom: a big low thump underneath
    const thump = audio.createOscillator(), tg = audio.createGain();
    thump.type = 'sine';
    thump.frequency.setValueAtTime(90, t); thump.frequency.exponentialRampToValueAtTime(28, t + 0.6);
    tg.gain.setValueAtTime(0.0001, t); tg.gain.exponentialRampToValueAtTime(0.9, t + 0.01); tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
    thump.connect(tg).connect(audio.destination);
    noise.start(t); noise.stop(t + 1.7); thump.start(t); thump.stop(t + 0.75);
  }

  function puff(cx, cy, r, dx, dy, grow, ms, delay) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', r);
    c.setAttribute('fill', '#dcdcdc'); c.setAttribute('opacity', '0');
    mascot.querySelector('.smoke').append(c);
    c.animate([
      { transform: 'translate(0, 0) scale(.4)', opacity: 0.9 },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5}px) scale(${grow * 0.7})`, opacity: 0.7, offset: 0.3 },
      { transform: `translate(${dx}px, ${dy}px) scale(${grow})`, opacity: 0 },
    ], { duration: ms, delay, easing: 'ease-out', fill: 'backwards' }).onfinish = () => c.remove();
  }

  mascot.addEventListener('click', () => {
    if (reloading) return;
    reloading = true;
    gunshotSound();
    const flash = mascot.querySelector('.flash');
    flash.animate([{ opacity: 1 }, { opacity: 1, offset: 0.4 }, { opacity: 0 }], { duration: 120 });
    mascot.querySelector('.recoil').animate([
      { transform: 'none' },
      { transform: 'translate(-5px, 5px) rotate(-5deg)', offset: 0.12 },
      { transform: 'none' },
    ], { duration: 450, easing: 'ease-out' });
    // small puff at the flintlock pan, then a big cloud out of the muzzle drifting up and away
    puff(77, 137, 3, -6, -14, 3, 900, 0);
    for (let i = 0; i < 9; i++) {
      puff(186 + i * 2.5, 15 - i * 3, 4 + Math.random() * 3, 18 + Math.random() * 26, -22 - Math.random() * 30, 2.4 + Math.random() * 1.6, 1600 + Math.random() * 900, i * 25);
    }
    setTimeout(() => { reloading = false; }, 1200);
    // every third shot brings out Toasty, just after the boom
    if (++shots % 3 === 0) setTimeout(toastyPop, 400);
  });
</script>

<script>
  // Next games -- pulled live from ESPN's public APIs on every page load.
  // The core API lists every game on a team's season; the site scoreboard adds poll ranks, status and logos.
  const CORE = 'https://sports.core.api.espn.com/v2/sports/';
  const SITE = 'https://site.api.espn.com/apis/site/v2/sports/';
  const ET = 'America/New_York';
  const SEASON = new Date().getMonth() < 6 ? new Date().getFullYear() - 1 : new Date().getFullYear();
  // ESPN names basketball seasons by the year they end (2026-27 = 2027)
  const seasonFor = card => SEASON + (card.dataset.seasonEnd ? 1 : 0);
  // no-cache: always check with ESPN (cheap if unchanged), so refreshes never show a stale score
  const getJSON = url => fetch(url, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const isWVU = c => /West Virginia/i.test(c.team.displayName || c.team.location || '');
  const rank = c => { const r = c.curatedRank && c.curatedRank.current; return r && r < 99 ? '#' + r : 'Unranked'; };
  const ymdET = iso => new Intl.DateTimeFormat('en-CA', { timeZone: ET, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso)).replace(/-/g, '');
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // Every game on a team's season, from the core API
  async function seasonEvents(sport, league, team, season) {
    const list = await getJSON(CORE + sport + '/leagues/' + league + '/seasons/' + season + '/teams/' + team + '/events?limit=100');
    return Promise.all((list.items || []).map(i => getJSON(i.$ref.replace(/^http:/, 'https:')).catch(() => null)));
  }

  // End of each soccer conference's regular season. ESPN flags conference tournament games as conference games
  // too (with nothing else telling them apart), so games after this date are left out of the conference record
  // and it matches the official standings. Update each season.
  const CONF_REG_END = {
    'usa.ncaa.m.1': '2026-11-06T00:00:00Z',   // Sun Belt, last regular-season games Nov 3-5, 2026
    'usa.ncaa.w.1': '2026-11-07T00:00:00Z',   // Big 12, last regular-season games Nov 5-6, 2026
  };
  // Conference record counted from finished conference games; soccer adds ties (W-L-T)
  function confRecord(events, team, sport, league) {
    let w = 0, l = 0, t = 0;
    const done = Math.min(Date.now() - 3 * 3600e3, CONF_REG_END[league] ? Date.parse(CONF_REG_END[league]) : Infinity);
    for (const e of events) {
      const c = e && e.competitions && e.competitions[0];
      if (!c || !c.conferenceCompetition || new Date(e.date) > done) continue;
      const me = c.competitors.find(x => x.id === String(team)), them = c.competitors.find(x => x.id !== String(team));
      if (!me || !them) continue;
      if (me.winner) w++; else if (them.winner) l++; else t++;
    }
    return sport === 'soccer' ? w + '-' + l + '-' + t : w + '-' + l;
  }

  // ESPN's football feed carries conference records; soccer has to be counted from the schedule
  async function confFor(card, competitor, events) {
    const conf = (competitor.records || []).find(r => r.type === 'vsconf');
    if (conf) return conf.summary;
    const { sport, league } = card.dataset;
    return confRecord(events || await seasonEvents(sport, league, competitor.id, seasonFor(card)), competitor.id, sport, league);
  }

  // The game to show: one in progress first; otherwise a game that finished recently (FINAL, kept up until
  // FINAL_HOURS after its start); otherwise the next game. Walks the season list from FINAL_HOURS ago forward.
  const FINAL_HOURS = 15;
  async function nextGame(card) {
    const { sport, league, team, groups } = card.dataset;
    const cutoff = Date.now() - FINAL_HOURS * 3600e3;
    let final = null;
    // returns the game to show, or undefined to keep looking
    const consider = match => {
      const st = match.competitions[0].status.type.state;
      if (st === 'post') { if (new Date(match.date) >= cutoff) final = match; return; }
      return st === 'in' || !final ? match : final;
    };
    // ESPN's season game list is empty for college baseball, so cards marked data-scan="N" look at the
    // scoreboard one day at a time for the next N days
    if (card.dataset.scan) {
      card._events = [];
      for (let day = 0; day < Number(card.dataset.scan); day++) {
        const date = new Date(Date.now() + day * 86400e3).toISOString();
        const sb = await getJSON(SITE + sport + '/' + league + '/scoreboard?limit=500&dates=' + ymdET(date) + (groups ? '&groups=' + groups : ''));
        const mine = (sb.events || []).filter(e => e.competitions[0].competitors.some(c => String(c.id) === team)).sort((a, b) => new Date(a.date) - new Date(b.date));
        for (const m of mine) { const pick = consider(m); if (pick) return pick; }
      }
      return final;
    }
    const events = await seasonEvents(sport, league, team, seasonFor(card));
    card._events = events;
    const upcoming = events.filter(e => e && new Date(e.date) >= cutoff).sort((a, b) => new Date(a.date) - new Date(b.date));
    for (const ev of upcoming) {
      const sb = await getJSON(SITE + sport + '/' + league + '/scoreboard?limit=500&dates=' + ymdET(ev.date) + (groups ? '&groups=' + groups : ''));
      const match = (sb.events || []).find(e => e.id === ev.id);
      if (!match) continue;
      const pick = consider(match);
      if (pick) return pick;
    }
    return final;
  }

  // Votes for an unranked WVU team (cards marked data-votes), shown as "*Unranked" plus a footnote.
  // Soccer: ESPN's copy of the United Soccer Coaches poll says who is receiving votes but not how many, so the
  // count is copied from unitedsoccercoaches.org and only shows while ESPN's latest poll is the one it came from
  // (update on Tuesdays). Basketball: ESPN carries the point totals, so these stay current on their own.
  const SOCCER_VOTES = {
    'usa.ncaa.w.1': { poll: '2026-10-27', teams: { '20382': 3 } },
  };
  const votesText = n => 'Received ' + n + ' Vote' + (n === 1 ? '' : 's');
  async function wvuVotes(card) {
    const { sport, league, team, votes } = card.dataset;
    if (!votes) return null;
    if (sport === 'soccer') {
      const list = await getJSON(CORE + sport + '/leagues/' + league + '/rankings');
      const poll = await getJSON(list.items[0].$ref.replace(/^http:/, 'https:'));
      if (!(poll.others || []).some(o => ((o.team && o.team.$ref) || '').includes('/teams/' + team + '?'))) return null;
      const known = SOCCER_VOTES[league];
      const n = known && (poll.date || '').startsWith(known.poll) && known.teams[team];
      return n ? votesText(n) : 'Receiving Votes';
    }
    // votes="Coaches Poll" (or "AP Top 25") picks which ESPN poll to read
    const { rankings = [] } = await getJSON(SITE + sport + '/' + league + '/rankings');
    const poll = rankings.find(r => r.name === votes || r.shortName === votes);
    const o = poll && (poll.others || []).find(x => x.team && String(x.team.id) === team);
    return o && o.points ? votesText(o.points) + ' In ' + votes : null;
  }

  // Conference names: ESPN's core API has them for football, basketball and volleyball teams. Soccer teams
  // have none there, so a soccer conference game means the opponent is in WVU's conference.
  // ESPN labels the MAAC (Metro Atlantic) as just "Metro", so that one is renamed.
  const CONF_FIX = { 'Metro': 'MAAC' };
  // ESPN's standings feed for the whole league: every conference (id, name, teams with records). Fetched once per league.
  // (ESPN's team-page feed has each team's conference too, but it refuses requests from other sites.)
  const allStandings = {};
  async function conferenceOf(card, teamId) {
    const { sport, league } = card.dataset;
    allStandings[league] = allStandings[league] || getJSON('https://site.api.espn.com/apis/v2/sports/' + sport + '/' + league + '/standings');
    const find = x => x.standings && (x.standings.entries || []).some(e => e.team && String(e.team.id) === String(teamId))
      ? x : (x.children || []).map(find).find(Boolean);
    return find(await allStandings[league]) || null;
  }
  const confGroupId = async (card, teamId) => { const c = await conferenceOf(card, teamId); return c && c.id || null; };
  // A team's conference standings, shaped like a game summary's standings group (entries with id, team name and stats)
  // plus ESPN's standings page link. Used when the game summary has none (non-conference games).
  async function confStandings(card, teamId) {
    const s = await conferenceOf(card, teamId);
    if (!s) return null;
    return { header: s.name, href: 'https://www.espn.com/' + card.dataset.league + '/standings/_/group/' + s.id,
             standings: { entries: s.standings.entries.map(e => ({ id: e.team && e.team.id, team: e.team && e.team.displayName, stats: e.stats })) } };
  }
  async function oppConference(card, opp, ev) {
    const { sport, league, conf } = card.dataset;
    try {
      const team = await getJSON(CORE + sport + '/leagues/' + league + '/seasons/' + seasonFor(card) + '/teams/' + opp.id);
      if (team.groups && team.groups.$ref) {
        let g = await getJSON(team.groups.$ref.replace(/^http:/, 'https:'));
        // ESPN sometimes files a team under a catch-all group ("NCAA Basketball", isConference false: Mercer 2026-27);
        // its team page has the real one, so look that group up instead
        if (g.isConference === false) {
          const gid = await confGroupId(card, opp.id);
          if (gid) g = await getJSON(CORE + sport + '/leagues/' + league + '/seasons/' + seasonFor(card) + '/types/2/groups/' + gid);
        }
        const name = g.isConference !== false && (g.shortName || g.name);
        if (name) return CONF_FIX[name] || name;
      }
    } catch (e) { /* fall through */ }
    const core = (card._events || []).find(e => e && e.id === ev.id);
    return core && core.competitions[0].conferenceCompetition ? conf : null;
  }

  // "Lubbock, TX" from ESPN's venue address, which sometimes spells out the state or leaves it off
  const STATES = { Alabama: 'AL', Alaska: 'AK', Arizona: 'AZ', Arkansas: 'AR', California: 'CA', Colorado: 'CO', Connecticut: 'CT',
    Delaware: 'DE', Florida: 'FL', Georgia: 'GA', Hawaii: 'HI', Idaho: 'ID', Illinois: 'IL', Indiana: 'IN', Iowa: 'IA', Kansas: 'KS',
    Kentucky: 'KY', Louisiana: 'LA', Maine: 'ME', Maryland: 'MD', Massachusetts: 'MA', Michigan: 'MI', Minnesota: 'MN', Mississippi: 'MS',
    Missouri: 'MO', Montana: 'MT', Nebraska: 'NE', Nevada: 'NV', 'New Hampshire': 'NH', 'New Jersey': 'NJ', 'New Mexico': 'NM',
    'New York': 'NY', 'North Carolina': 'NC', 'North Dakota': 'ND', Ohio: 'OH', Oklahoma: 'OK', Oregon: 'OR', Pennsylvania: 'PA',
    'Rhode Island': 'RI', 'South Carolina': 'SC', 'South Dakota': 'SD', Tennessee: 'TN', Texas: 'TX', Utah: 'UT', Vermont: 'VT',
    Virginia: 'VA', Washington: 'WA', 'West Virginia': 'WV', Wisconsin: 'WI', Wyoming: 'WY', 'District of Columbia': 'DC' };
  // venue names ESPN has out of date (WVU volleyball plays in Hope Coliseum)
  const VENUE_FIX = { 'WVU Coliseum': 'Hope Coliseum' };
  // venues where ESPN leaves the state off -- add to this as they come up
  const CITY_STATE = { Harrisonburg: 'VA', Morgantown: 'WV' };
  function gameCity(comp) {
    const a = (comp.venue && comp.venue.address) || {};
    let city = (a.city || '').trim(), state = (a.state || '').trim();
    if (!state && city.includes(',')) [city, state] = city.split(',').map(s => s.trim());
    if (!state) state = CITY_STATE[city] || '';
    if (!city) return null;
    state = STATES[state] || state;
    return state ? city + ', ' + state : city;
  }
  const gameTV = comp => {
    const names = [...new Set((comp.broadcasts || []).flatMap(b => b.names || []))];
    return names.length ? names.join(', ') : null;
  };
  // Broadcast for games ESPN's feed has none for yet, by ESPN event id (ESPN's own listing wins once it has one)
  const GAME_TV = {
    '401929854': 'ESPN+',   // men's soccer vs Coastal Carolina, Nov 11, 2026 (ESPN watch page)
  };

  // Soccer conference standings from sunbeltsports.org and big12sports.com, in order, with each team's conference
  // record. wvu-data.json (updated every 2 hours by the GitHub job) replaces these; the copy below is the fallback. A rank only shows while ESPN's count of that team's conference
  // record still matches, so it drops off by itself after the team's next game. Update after games.
  const SOCCER_STANDINGS = {
    'usa.ncaa.m.1': [['West Virginia', '6-1-2'], ['Marshall', '6-1-2'], ['UCF', '5-3-1'], ['James Madison', '4-2-3'],
      ['Coastal Carolina', '4-3-2'], ['South Carolina', '3-4-2'], ['Kentucky', '3-4-2'], ['Georgia Southern', '2-5-2'],
      ['Old Dominion', '2-6-1'], ['Georgia State', '1-7-1']],   // sunbeltsports.org, final regular season (Nov 5, 2026)
    'usa.ncaa.w.1': [['Texas Tech', '8-1-1'], ['BYU', '7-1-2'], ['Baylor', '7-2-1'], ['Houston', '7-2-1'], ['Colorado', '7-3-0'],
      ['Kansas', '6-2-2'], ['UCF', '5-3-2'], ['West Virginia', '4-4-2'], ['Arizona State', '4-5-1'], ['Oklahoma State', '3-5-2'],
      ['Arizona', '2-4-4'], ['Cincinnati', '2-6-2'], ['TCU', '2-7-1'], ['Utah', '1-6-3'], ['Kansas State', '1-7-2'], ['Iowa State', '0-8-2']],
  };
  const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  function soccerConfRank(card, c, confRec) {
    const table = SOCCER_STANDINGS[card.dataset.league];
    if (!table || !confRec) return null;
    const i = table.findIndex(([name]) => name === c.team.location || name === c.team.shortDisplayName);
    return i >= 0 && table[i][1] === confRec ? { text: ordinal(i + 1) + ' of ' + table.length, href: SOCCER_STANDINGS_URL[card.dataset.league] } : null;
  }
  // Links for the Conf. rank values on soccer cards (the pages the standings above come from).
  // Big 12's page id changes each season: big12sports.com/sports/wsoc links the current one.
  const SOCCER_STANDINGS_URL = {
    'usa.ncaa.m.1': 'https://sunbeltsports.org/standings.aspx?path=msoc',
    'usa.ncaa.w.1': 'https://big12sports.com/standings.aspx?standings=238&path=soc',
  };
  // Volleyball Conf. rank links, by the conference name in ESPN's standings header, e.g. "2026 Big 12 Conference Standings" (page id changes each season: big12sports.com/sports/wvball)
  const VB_STANDINGS_URL = {
    'Big 12': 'https://big12sports.com/standings.aspx?standings=237&path=vb',
  };
  // Poll row: one link per sport to ESPN's rankings page, whose poll menu lists every poll for that sport
  // (rifle isn't on ESPN; its card links ncaa.com's CRCA poll)
  const ESPN_RANKINGS = {
    'college-football': 'https://www.espn.com/college-football/rankings',
    'mens-college-basketball': 'https://www.espn.com/mens-college-basketball/rankings',
    'womens-college-basketball': 'https://www.espn.com/womens-college-basketball/rankings',
    'usa.ncaa.m.1': 'https://www.espn.com/mens-college-soccer/rankings',
    'usa.ncaa.w.1': 'https://www.espn.com/womens-college-soccer/rankings',
    'womens-college-volleyball': 'https://www.espn.com/college-sports/rankings/_/pollId/89/sportId/18530000',
    'college-baseball': 'https://www.espn.com/college-sports/rankings/_/pollId/10543/sportId/10031000',
  };
  const POLL_LINK = Object.fromEntries(Object.entries(ESPN_RANKINGS).map(([k, href]) => [k, { text: 'Rankings', href }]));

  // Team nickname (Mountaineers, Bearcats). ESPN's soccer feed puts the school in 'name', so fall back to
  // 'nickname', then to the display name minus the school ('Cincinnati Bearcats' -> 'Bearcats').
  const nickname = c => {
    const tm = c.team, loc = tm.location || '';
    if (tm.nickname) return tm.nickname;
    if (tm.name && tm.name !== loc) return tm.name;
    const rest = (tm.displayName || '').startsWith(loc) ? tm.displayName.slice(loc.length).trim() : '';
    return rest || null;
  };
  // Soccer's scoreboard has no nickname at all; ESPN's season team record does.
  const teamNickname = async (card, c) => nickname(c) || await getJSON(CORE + card.dataset.sport + '/leagues/' + card.dataset.league
    + '/seasons/' + seasonFor(card) + '/teams/' + c.id).then(tm => tm.nickname || null).catch(() => null);

  // Extra line under the matchup for specific ESPN games (by ESPN event id), like the high school 'State Semifinal' line
  const GAME_NOTE = {
    '401929850': 'Sun Belt Quarterfinal',   // men's soccer vs Georgia Southern, Nov 8, 2026
    '401929890': 'Big 12 Quarterfinal',     // women's soccer vs BYU, Nov 9, 2026
    '401929854': 'Sun Belt Semifinal',      // men's soccer vs Coastal Carolina, Nov 11, 2026
  };

  async function loadGame(card) {
    const label = card.querySelector('.sport').textContent;
    try {
      const ev = await nextGame(card);
      card.replaceChildren(el('div', 'sport', label));
      if (!ev) { if (!useFallback(card)) { card.append(el('p', 'note', 'No upcoming game scheduled')); card._ok = true; } return; }

      card.dataset.when = new Date(ev.date).getTime();
      card._ev = { id: ev.id, date: ev.date };
      const comp = ev.competitions[0];
      const wv = comp.competitors.find(isWVU) || comp.competitors[0];
      const opp = comp.competitors.find(c => c !== wv);
      const prefix = comp.neutralSite || wv.homeAway === 'home' ? 'vs' : 'at';

      const logo = opp.team.logo || (opp.team.logos && opp.team.logos[0] && opp.team.logos[0].href);
      const d = new Date(ev.date);
      const state = comp.status && comp.status.type && comp.status.type.state;
      card.dataset.state = state;
      const day = d.toLocaleDateString('en-US', { timeZone: ET, weekday: 'short', month: 'short', day: 'numeric' });
      let when;
      if (state === 'in') {
        // the clock text is kept so the live refresh can update it in place
        card._clock = document.createTextNode(' · ' + comp.status.type.shortDetail);
        when = el('div', 'when'); when.append(el('span', 'live', 'LIVE NOW'), card._clock);
      } else if (state === 'post') {
        when = el('div', 'when'); when.append(el('span', 'final', (comp.status.type.shortDetail || 'Final').toUpperCase()), ' · ' + day);
      } else {
        const time = comp.timeValid === false ? 'Time TBA' : d.toLocaleTimeString('en-US', { timeZone: ET, hour: 'numeric', minute: '2-digit' }) + ' ET';
        when = el('div', 'when', day + ' · ' + time);
      }
      const city = gameCity(comp);
      if (city) when.append(' · ' + city);

      // Record shown as overall (conference), e.g. 9-4-2 (5-1-2)
      // ESPN writes soccer records as W-T-L; flip to W-L-T to match the conference counts
      const overall = c => {
        const r = (c.records || []).find(x => x.type === 'total');
        if (!r) return '—';
        const p = r.summary.split('-');
        return card.dataset.sport === 'soccer' && p.length === 3 ? [p[0], p[2], p[1]].join('-') : r.summary;
      };
      const [oppConf, wvConf, votes] = await Promise.all([confFor(card, opp).catch(() => null), confFor(card, wv, card._events).catch(() => null), wvuVotes(card).catch(() => null)]);
      const record = (c, conf) => overall(c) + (conf ? ' (' + conf + ')' : '');
      const starred = votes && rank(wv) === 'Unranked';

      // ESPN's game summary: matchup predictor (football and basketball) and both conferences' standings
      const summary = await getJSON(SITE + card.dataset.sport + '/' + card.dataset.league + '/summary?event=' + ev.id).catch(() => ({}));
      // Cards with data-polls use the first listed poll ESPN currently has (football: the CFP rankings in the weeks they
      // come out, otherwise the AP poll); a team not in that poll shows no rank. Other cards use ESPN's own rank.
      let pollRanks = null, pollLink = POLL_LINK[card.dataset.league] || null;

    applyData(d);
    WVU_MANUAL.filter(s => !espnCards.some(c => c.dataset.fallback === s.label)).forEach(s => grid.append(manualCard({ ...s, college: true })));
    // each card checks for a win as soon as it loads, so the fireworks don't wait for the slowest card
    Promise.all(espnCards.map(c => loadGame(c).then(celebrate))).then(() => { byDate(grid); setTimeout(tick, nextTick()); });
  });

  // Fireworks when a card shows a WVU win (FINAL). Each win sets them off once per browser -- on the first visit
  // after the game, or right when a game you're watching goes final. Skipped for people who turn off animations.
  function celebrate() {
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('wvu-wins-seen') || '[]'); } catch (e) { /* storage blocked: still celebrate */ }
    const wins = shown().map(c => c.dataset.win).filter(id => id && !seen.includes(id));
    if (!wins.length) return;
    try { localStorage.setItem('wvu-wins-seen', JSON.stringify([...seen, ...wins].slice(-50))); } catch (e) { /* ignore */ }
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) fireworks();
  }
  // Fireworks sounds, made in the browser like the musket: a rising whistle on launch, then a boom and crackle
  // at the burst, panned left/right to where it is on screen. Browsers only allow sound after the visitor has
  // clicked or tapped something on the page, so on a fresh visit the fireworks may be silent.
  function fwSound(kind, x, delay = 0) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    const a = audio, t = a.currentTime + delay;
    const out = a.createGain(); out.gain.value = 0.5;
    const pan = a.createStereoPanner ? a.createStereoPanner() : null;
    if (pan) { pan.pan.value = Math.max(-1, Math.min(1, (x / innerWidth) * 2 - 1)) * 0.8; out.connect(pan).connect(a.destination); }
    else out.connect(a.destination);
    const noise = secs => { const len = Math.floor(a.sampleRate * secs), b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; const s = a.createBufferSource(); s.buffer = b; return s; };
    if (kind === 'launch') {
      const o = a.createOscillator(), g = a.createGain(); o.type = 'sine';
      const f = 900 + Math.random() * 500;
      o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 2.2, t + 0.9);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
      o.connect(g).connect(out); o.start(t); o.stop(t + 1);
      return;
    }
    // boom
    const n = noise(1.2), lp = a.createBiquadFilter(), g = a.createGain(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2200 + Math.random() * 1200, t); lp.frequency.exponentialRampToValueAtTime(120, t + 0.9);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.7, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    n.connect(lp).connect(g).connect(out); n.start(t); n.stop(t + 1.2);
    const th = a.createOscillator(), tg = a.createGain(); th.type = 'sine';
    th.frequency.setValueAtTime(70 + Math.random() * 30, t); th.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    tg.gain.setValueAtTime(0.0001, t); tg.gain.exponentialRampToValueAtTime(0.6, t + 0.01); tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    th.connect(tg).connect(out); th.start(t); th.stop(t + 0.5);
    // crackle: lots of tiny pops scattered after the boom
    const pops = 14 + Math.floor(Math.random() * 14);
    for (let i = 0; i < pops; i++) {
      const pt = t + 0.25 + Math.random() * 0.9, p = noise(0.03), hp = a.createBiquadFilter(), pg = a.createGain();
      hp.type = 'highpass'; hp.frequency.value = 2500 + Math.random() * 3000;
      pg.gain.setValueAtTime(0.0001, pt); pg.gain.exponentialRampToValueAtTime(0.12 + Math.random() * 0.12, pt + 0.002); pg.gain.exponentialRampToValueAtTime(0.0001, pt + 0.025);
      p.connect(hp).connect(pg).connect(out); p.start(pt); p.stop(pt + 0.03);
    }
  }
  function fireworks(ms = 10000, done) {
    const cv = document.createElement('canvas'), g = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
    cv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;z-index:4;pointer-events:none';
    const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); addEventListener('resize', size);
    document.body.append(cv);
    // red, orange, yellow, green, blue, purple, pink, silver, gold -- dealt out like cards (every color once before
    // any repeats) so the show never runs to just a couple of colors
    const COLORS = ['#ff2a2a', '#ff7a00', '#ffe600', '#22dd22', '#1e6bff', '#9b30ff', '#ff3fa4', '#c8ccd4', '#ffc21a'];
    const rockets = [], sparks = [], start = performance.now();
    let nextLaunch = start, last = start, deck = [];
    const pick = () => { if (!deck.length) deck = [...COLORS].sort(() => Math.random() - 0.5); return deck.pop(); };
    const launch = () => {
      const W = innerWidth, H = innerHeight, x = W * (0.15 + Math.random() * 0.7);
      // a third of the bursts are two-color, the rest one color
      rockets.push({ x, y: H, vx: (Math.random() - 0.5) * 60, vy: -(H * 0.9 + Math.random() * H * 0.35),
                     top: H * (0.12 + Math.random() * 0.33), color: pick(), color2: Math.random() < 0.33 ? pick() : null });
      fwSound('launch', x);
    };
    const burst = r => {
      const n = 60 + Math.floor(Math.random() * 40), speed = 140 + Math.random() * 120;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + Math.random() * 0.2, s = speed * (0.55 + Math.random() * 0.45);
        sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, fade: 0.55 + Math.random() * 0.4,
                      color: r.color2 && i % 2 ? r.color2 : r.color });
      }
      fwSound('burst', r.x);
    };
    const frame = now => {
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      if (now - start < ms && now >= nextLaunch) { launch(); if (Math.random() < 0.35) launch(); nextLaunch = now + 350 + Math.random() * 450; }
      // fade the previous frame instead of clearing it, which leaves short trails
      g.globalCompositeOperation = 'destination-out'; g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, 0, innerWidth, innerHeight);
      // normal drawing (not additive), so the navy background doesn't tint every color toward blue/white
      g.globalCompositeOperation = 'source-over';
      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.vy += 380 * dt; r.x += r.vx * dt; r.y += r.vy * dt;
        g.fillStyle = r.color; g.fillRect(r.x - 1.5, r.y - 1.5, 3, 3);
        if (r.y <= r.top || r.vy >= 0) { burst(r); rockets.splice(i, 1); }
      }
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.vx *= 0.985; s.vy = s.vy * 0.985 + 90 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= s.fade * dt;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        g.globalAlpha = s.life; g.fillStyle = s.color; g.beginPath(); g.arc(s.x, s.y, 2.4, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
      if (now - start < ms || rockets.length || sparks.length) requestAnimationFrame(frame);
      else { removeEventListener('resize', size); cv.remove(); if (done) done(); }
    };
    requestAnimationFrame(frame);
  }

  // Auto-refresh, cards only (the music and animations keep going):
  //  - a live game: score and clock every 30 seconds; when it ends the card rebuilds as FINAL
  //  - a game starting within 15 minutes: the card rebuilds every minute, so it flips to LIVE on its own
  //  - every card: rebuilt every 10 minutes, and right away when you come back to the tab
  // Nothing refreshes while the tab is in the background. A refresh that fails keeps the card as it was.
  const REFRESH_ALL = 10 * 60e3, REFRESH_LIVE = 30e3, REFRESH_IDLE = 60e3, SOON = 15 * 60e3;
  let lastAll = Date.now(), busy = false;
  const shown = () => espnCards.filter(c => c.isConnected);
  const nextTick = () => shown().some(c => c.dataset.state === 'in') ? REFRESH_LIVE : REFRESH_IDLE;
  async function reloadCard(card) {
    const fresh = card.cloneNode(false);
    delete fresh.dataset.when; delete fresh.dataset.state;
    fresh.append(card.querySelector('.sport').cloneNode(true));
    await loadGame(fresh);
    if (!fresh._ok || !card.isConnected) return;
    card.replaceWith(fresh);
    espnCards[espnCards.indexOf(card)] = fresh;
  }
  async function liveScore(card) {
    const { sport, league, groups } = card.dataset;
    const sb = await getJSON(SITE + sport + '/' + league + '/scoreboard?limit=500&dates=' + ymdET(card._ev.date) + (groups ? '&groups=' + groups : ''));
    const m = (sb.events || []).find(e => e.id === card._ev.id);
    if (!m) return;
    const comp = m.competitions[0];
    if (comp.status.type.state !== 'in') return reloadCard(card);   // just ended: rebuild as FINAL
    const wv = comp.competitors.find(isWVU) || comp.competitors[0], opp = comp.competitors.find(c => c !== wv);
    const val = c => typeof c.score === 'object' ? c.score.displayValue : c.score;
    if (card._scores && card._scores.length === 2) { card._scores[0].textContent = val(wv); card._scores[1].textContent = val(opp); }
    if (card._clock) card._clock.textContent = ' · ' + comp.status.type.shortDetail;
  }
  async function refresh(all) {
    if (busy || document.hidden) return;
    busy = true;
    try {
      if (all) { lastAll = Date.now(); await Promise.all(shown().map(c => reloadCard(c).catch(() => {}))); }
      else await Promise.all(shown().filter(c => c._ev).map(c =>
        c.dataset.state === 'in' ? liveScore(c).catch(() => {})
        : c.dataset.state === 'pre' && new Date(c._ev.date) - Date.now() < SOON ? reloadCard(c).catch(() => {}) : null));
      byDate(grid);
      celebrate();
    } finally { busy = false; }
  }
  async function tick() {
    await refresh(Date.now() - lastAll >= REFRESH_ALL);
    setTimeout(tick, nextTick());
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastAll > REFRESH_IDLE) refresh(true); });

  // Sissonville High School -- no public live feed, so schedules (MaxPreps) and ranks are entered by hand.
  // Football ranks are the WVSSAC playoff ratings (Tuesdays); soccer shows WVSSAC state-tournament seeds.
  // As of: football ranks WVSSAC final Week 11 (Nov 7, 2026); girls soccer WVSSAC state seed (= MaxPreps AA-A #3);
  // boys soccer and volleyball ranks MaxPreps (last updated Nov 5 / Nov 7, 2026); records checked against MaxPreps Nov 8, 2026.
  const SVILLE = [
    // Playoffs: WVSSAC pairings Sat Nov 7 (late), dates and times Sun Nov 8. Rank: WVSSAC FINAL Week 11 ratings (Nov 7: Sissonville 2nd in AA, 13.4, behind Frankfort); final score MetroNews.
    // Class AA first round (WVSSAC bracket, Nov 7, 2026): No. 2 Sissonville vs No. 15 Mingo Central. Date from MaxPreps
    // (Fri Nov 13); no kickoff time posted yet as of Nov 8 -- 'date' holds 7 PM ET for the live-score window.
    { label: 'Football', first: true, done: 'Playoffs Schedule TBA', doneLogo: 'sissonville-logo.png', last: '2026-11-07T00:00:00Z',
      games: [
        { date: '2026-11-14T00:00:00Z', where: 'Charleston, WV', prefix: 'vs', subtitle: 'Class AA First Round', live: 'Sissonville',
          us: { rank: 2, name: 'Sissonville', nick: 'Indians', logo: 'sissonville-logo.png', record: '10-0' },
          them: { rank: 15, name: 'Mingo Central', nick: 'Miners', logo: 'mingo-central-logo.png', record: '6-4' }, rows: [
          // home game: higher seed hosts round 1, and MaxPreps lists it at Sissonville (same place/venue as the other home cards)
          ['Venue', 'Sissonville High School'], ['Broadcast', 'TBA']] },
      ],
      poll: { label: 'Ratings', text: 'Rankings', href: 'https://www.wvssac.org/football-ratings/' }, rows: [
      ['Last game', 'W 48-0'], ['Last opponent', 'Wayne'], ['Sissonville rank', '#2 in Class AA'], ['Sissonville record', '10-0']] },
    // Last opponent ranks: MaxPreps class rankings, same lists as Sissonville's (fall: Nov 9, 2026; spring: final, Jun 26, 2026)
    { label: 'Girls Soccer', done: 'Season Ended', doneLogo: 'sissonville-logo.png', last: '2026-11-05T17:00:00Z', result: 'L 1-3', rows: [
      ['Last game', 'State Semifinal'], ['Last opponent', '#2 Lincoln'], ['Sissonville rank', '#3 in Class AA/A'], ['Sissonville record', '16-5']] },
    { label: 'Boys Soccer', done: 'Season Ended', doneLogo: 'sissonville-logo.png', last: '2026-10-27T22:00:00Z', result: 'L 1-3', rows: [
      ['Last game', 'Regional Semifinal'], ['Last opponent', '#7 Buffalo'], ['Sissonville rank', '#8 in Class AA/A'], ['Sissonville record', '13-8']] },
    { label: 'Volleyball', done: 'Season Ended', doneLogo: 'sissonville-logo.png', last: '2026-10-27T22:00:00Z', result: 'L 1-3', rows: [
      // Last game: Class AA Region IV first round, 9 seed Sissonville at 8 seed Buffalo, Oct 27 (WVSSAC bracket)
      ['Last game', 'Regional First Round'], ['Last opponent', '#26 Buffalo'], ['Sissonville rank', '#30 in Class AA'], ['Sissonville record', '4-30 (0-11)']] },
    // Winter and spring schedules from MaxPreps (Nov 5, 2026); the next listed game for each
    { label: 'Boys Basketball', games: [
      { date: '2026-12-04T23:00:00Z', where: 'Ravenswood, WV', prefix: 'at',
        us: { name: 'Sissonville', nick: 'Indians', logo: 'sissonville-logo.png', record: '0-0' }, them: { name: 'Ravenswood', nick: 'Red Devils', logo: 'ravenswood-logo.png', record: '0-0' }, rows: [
        ['Venue', 'Ravenswood High School']] },
    ] },
    { label: 'Girls Basketball', games: [
      { date: '2026-12-10T00:00:00Z', where: 'Charleston, WV', prefix: 'vs',
        us: { name: 'Sissonville', nick: 'Indians', logo: 'sissonville-logo.png', record: '0-0' }, them: { name: 'Logan', nick: 'Wildcats', logo: 'logan-logo.png', record: '0-0' }, rows: [
        ['Venue', 'Sissonville High School']] },
    ] },
    // Spring 2026 seasons (MaxPreps 25-26 schedules and rankings, updated Jun 26, 2026; MetroNews / WSAZ for the rounds).
    // Next spring's openers, for when these go back to game cards: baseball at Williamstown Mon Apr 26, 2027
    // 5:00 PM; softball vs Herbert Hoover Tue Mar 16, 2027 6:00 PM (MaxPreps, Nov 5, 2026).
    { label: 'Baseball', done: 'Season Ended', doneLogo: 'sissonville-logo.png', last: '2026-05-23T15:30:00Z', result: 'L 3-8', rows: [
      // Class AA Region IV (double elimination): lost to Buffalo 1-4 May 21, then eliminated by Charleston Catholic May 23
      ['Last game', 'Regional Tournament'], ['Last opponent', '#7 Charleston Catholic'], ['Sissonville rank', '#6 in Class AA'], ['Sissonville record', '23-7']] },
    { label: 'Softball', done: 'Season Ended', doneLogo: 'sissonville-logo.png', last: '2026-05-29T14:30:00Z', result: 'L 1-4', rows: [
      // Class AA state tournament (double elimination, Little Creek Park): eliminated by Oak Glen May 29
      ['Last game', 'State Tournament'], ['Last opponent', '#4 Oak Glen'], ['Sissonville rank', '#5 in Class AA'], ['Sissonville record', '26-8']] },
  ];
  // Live score for a game marked live: (its team name on MetroNews), from the MetroNews scoreboard through the
  // Cloudflare Worker (Desktop\Website stuff\metronews-scores-worker.js). Checked every 30 seconds from 15 minutes
  // before the start until MetroNews shows it final (at most 4 hours after the start); not while the tab is hidden.
  const SVILLE_LIVE = 'https://metronews-scores.chaynes112.workers.dev/';
  (function () {
    const grid = document.getElementById('sville-grid');
    const cards = SVILLE.map(s => { const c = manualCard(s); grid.append(c); return { s, c }; });
    byDate(grid);
    if (!SVILLE_LIVE) return;
    const WINDOW_BEFORE = 15 * 60e3, WINDOW_AFTER = 4 * 3600e3;
    const lc = s => String(s || '').trim().toLowerCase();
    // Fireworks for a Sissonville win, same rules as a WVU win: once per browser, skipped if animations are off
    function hsWin(id) {
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem('wvu-wins-seen') || '[]'); } catch (e) { /* storage blocked: still celebrate */ }
      if (seen.includes(id)) return;
      try { localStorage.setItem('wvu-wins-seen', JSON.stringify([...seen, id].slice(-50))); } catch (e) { /* ignore */ }
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) fireworks();
    }
    async function watch() {
      for (const x of cards) {
        // the game the card is showing (same pick as manualCard)
        const g = (x.s.games || []).find(y => new Date(y.through || y.date) >= Date.now() - 4 * 3600e3);
        if (!g || !g.live || document.hidden) continue;
        const t = new Date(g.date).getTime();
        if (Date.now() < t - WINDOW_BEFORE || Date.now() > t + WINDOW_AFTER || (g._live && g._live.state === 'post')) continue;
        try {
          const d = await getJSON(SVILLE_LIVE + '?team=' + encodeURIComponent(g.live));
          const m = (d.games || []).find(y => [y.away.name, y.home.name].some(n => lc(n) === lc(g.them.name)));
          if (!m) continue;
          const [us, them] = lc(m.away.name) === lc(g.live) ? [m.away, m.home] : [m.home, m.away];
          g._live = { state: m.state, status: m.status, us: us.score, them: them.score };
          if (m.state === 'post' && us.score > them.score) hsWin('sville-' + lc(x.s.label) + '-' + m.id);
          const fresh = manualCard(x.s);
          x.c.replaceWith(fresh);
          x.c = fresh;
        } catch (e) { /* relay or MetroNews unavailable: keep the card as it was */ }
      }
      setTimeout(watch, 30e3);
    }
    watch();
  })();
</script>
